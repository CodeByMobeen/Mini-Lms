<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Announcements — Mini LMS</title>
  <link rel="stylesheet" href="styles/theme.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">
        <img src="images/logo.svg" alt="logo">
        <div>
          <div class="brand">Mini LMS</div>
          <small>Student Portal</small>
        </div>
      </div>

      <nav style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
        <a class="nav-item" href="dashboard.html">Dashboard</a>
        <a class="nav-item" href="profile.html">Profile</a>
        <a class="nav-item" href="courses.html">Courses</a>
        <a class="nav-item" href="attendance.html">Attendance</a>
        <a class="nav-item" href="assignments.html">Assignments</a>
        <a class="nav-item" href="quiz.html">Quiz</a>
        <a class="nav-item" href="results.html">Results</a>
        <a class="nav-item" href="announcements.html">Announcements</a>
        <a class="nav-item" href="login.html">Logout</a>
      </nav>
    </aside>

    <main class="main container">
      <div class="topbar">
        <h2>Announcements</h2>
        <div class="muted">All announcements and notices</div>
      </div>

      <section class="announce-list mt-8" id="announce-list">
        <!-- announcements loaded from backend -->
      </section>

      <div class="footer" style="margin-top:18px">Mini LMS — Announcements</div>
    </main>
  </div>
  <script>
  async function loadAnnouncements(){
    try{
      const res = await fetch('http://localhost:5000/api/announcements');
      const data = await res.json();
      const container = document.getElementById('announce-list');
      container.innerHTML = '';
      (data.announcements||[]).forEach(a=>{
        const art = document.createElement('article');
        art.className = 'announce-card card';
        art.innerHTML = `<div style="width:64px"><small class="muted">${a.date}</small></div><div><strong>${a.title}</strong><p class="muted">${a.body}</p></div>`;
        container.appendChild(art);
      });
    }catch(err){console.error(err)}
  }
  loadAnnouncements();
  </script>
  <script src="scripts/theme.js" defer></script>
</body>
</html>
