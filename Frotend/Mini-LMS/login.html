<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Mini LMS</title>
  <link rel="stylesheet" href="styles/theme.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="container">
      <div class="auth-card card">
        <div class="auth-hero">
          <div class="logo">
            <img src="images/logo.svg" alt="University logo">
            <div>
              <div class="brand">Mini LMS</div>
              <small>Student Portal — Login</small>
            </div>
          </div>

          <h1 class="mt-8">Sign in to your account</h1>
          <p class="muted">Use your student credentials to access the portal.</p>

          <form id="login-form" style="margin-top:18px">
            <div class="form-group">
              <label for="student-id">Student ID</label>
              <input id="student-id" name="student-id" type="text" placeholder="e.g. S1234567">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="Your password">
            </div>
            <div class="form-group checkbox-row">
              <input id="remember" type="checkbox"><label for="remember">Remember me</label>
            </div>
            <div style="display:flex;gap:12px;align-items:center">
              <button class="btn" type="submit">Login</button>
              <a href="#" class="muted">Forgot password?</a>
            </div>
          </form>
        </div>

        <div>
          <img src="images/course-placeholder.svg" alt="illustration" style="width:100%;border-radius:10px">
        </div>
      </div>
    </div>
    <script>
    document.getElementById('login-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const student_id = document.getElementById('student-id').value;
      const password = document.getElementById('password').value;
      try{
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({student_id, password})
        });
        const data = await res.json();
        if(res.ok){
          // simple token storage
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          alert(data.error || 'Login failed');
        }
      }catch(err){
        alert('Could not reach backend');
      }
    });
    </script>
  </div>
  <script src="scripts/theme.js" defer></script>
</body>
</html>
